<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#C0392B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Actividapp">
<title>Actividapp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0392B;--rdark:#96281B;--rlight:#FAECE7;
  --bg:#F4F4F0;--card:#FFF;--text:#1A1A1A;--muted:#888;--brd:#E8E8E0;
  --green:#219653;--glight:#E8F5EE;
  --amber:#E67E22;--alight:#FEF5E7;
  --blue:#2471A3;--blight:#EAF4FB;
  --sh:0 1px 4px rgba(0,0,0,.07),0 0 0 0.5px rgba(0,0,0,.04)
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--card);overflow:hidden}
.scr{display:none;flex-direction:column;height:100%;overflow:hidden}.scr.on{display:flex}
.tb{background:var(--red);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;min-height:52px;flex-shrink:0}
.tb-t{font-size:16px;font-weight:600;flex:1}.tb-bk{font-size:24px;cursor:pointer;line-height:1}
.tb-a{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer}
.cnt{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}.cnt::-webkit-scrollbar{width:0}
.nb{display:flex;background:var(--card);border-top:1px solid var(--brd);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nb-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:9px;font-family:'DM Sans',sans-serif;touch-action:manipulation}
.nb-b.on{color:var(--red)}.nb-i{font-size:19px;line-height:1}
.card{background:var(--card);border-radius:14px;border:0.5px solid var(--brd);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.crow{display:flex;align-items:center;gap:12px}
.cico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cbody{flex:1;min-width:0}.ct{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cs{font-size:12px;color:var(--muted);margin-top:2px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--card);border-radius:14px;padding:14px;border:0.5px solid var(--brd);box-shadow:var(--sh)}
.sn{font-size:26px;font-weight:600;color:var(--red);line-height:1}.sl{font-size:11px;color:var(--muted);margin-top:4px}
.f{margin-bottom:12px}
.f label{font-size:11px;font-weight:500;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--text);outline:none;-webkit-appearance:none;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red)}.f textarea{resize:none}
.sw{position:relative}.sw::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.sw input{padding-left:32px!important}
.sv{display:none;background:var(--rlight);border:1px solid var(--red);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--rdark);margin-bottom:6px;align-items:center;justify-content:space-between}
.sv.on{display:flex}.sv-x{cursor:pointer;font-size:18px;color:var(--red);font-weight:600;line-height:1;padding-left:8px}
.sl2{width:100%;border:1px solid var(--brd);border-radius:9px;font-size:13px;padding:4px;background:var(--card);color:var(--text);outline:none;margin-top:4px}
.bp{background:var(--red);color:#fff;border:none;border-radius:11px;padding:14px;width:100%;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}
.bp:disabled{background:#ccc}
.bs{background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:11px;padding:12px;width:100%;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;touch-action:manipulation}
.bg2{background:transparent;color:var(--muted);border:0.5px solid var(--brd);border-radius:9px;padding:8px 12px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;touch-action:manipulation}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;border:0.5px solid var(--brd);cursor:pointer;background:var(--card);color:var(--muted);font-family:'DM Sans',sans-serif;user-select:none;touch-action:manipulation}
.chip.on{background:var(--rlight);color:var(--rdark);border-color:var(--red)}
.loc{background:var(--blight);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--blue);display:flex;align-items:center;gap:8px}
.loc.warn{background:#FFF8E1;color:#856404}
.fa{border:1.5px dashed var(--brd);border-radius:11px;padding:16px;text-align:center;cursor:pointer}
.fpimg{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:none}
#fileInput,#fileInputM{display:none}
.lw{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;background:var(--card)}
.em{text-align:center;padding:32px 16px;color:var(--muted)}.em-i{font-size:36px;margin-bottom:10px}
.ld{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.stl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;margin-top:4px}
.dv{height:0.5px;background:var(--brd);margin:12px 0}
.b{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.bg1{background:var(--glight);color:#145A32}.ba1{background:var(--alight);color:#7E5109}.br1{background:var(--rlight);color:var(--rdark)}.bb1{background:var(--blight);color:#1A5276}
.fab{position:fixed;bottom:74px;right:calc(50% - 224px);width:52px;height:52px;background:var(--red);border-radius:50%;border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px rgba(192,57,43,.4);z-index:10;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
@media(max-width:480px){.fab{right:14px}}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.95);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.up{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px}
.adm{background:rgba(255,215,0,.35);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.md{background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.md-pull{width:40px;height:4px;background:var(--brd);border-radius:2px;margin:0 auto 14px}
.mdt{font-size:16px;font-weight:600;margin-bottom:14px}
.drf{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.drf input[type=date]{padding:6px 8px;border:0.5px solid var(--brd);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--text);outline:none}
.drf .bp-sm{padding:6px 12px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer}
#um-map-cnt{flex:1;position:relative}#lmap{width:100%;height:100%}
.mleg{position:absolute;bottom:60px;left:10px;background:rgba(255,255,255,.92);border-radius:12px;padding:9px 12px;font-size:11px;z-index:10;box-shadow:var(--sh);line-height:2;pointer-events:none}
.mfi{background:var(--card);padding:7px 10px;border-bottom:0.5px solid var(--brd);flex-shrink:0;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mfc{padding:4px 9px;border-radius:20px;font-size:11px;border:0.5px solid var(--brd);cursor:pointer;background:var(--card);color:var(--muted);font-family:'DM Sans',sans-serif;white-space:nowrap;touch-action:manipulation}
.mfc.on{background:var(--rlight);color:var(--rdark);border-color:var(--red)}
.dbw{background:var(--card);border-radius:14px;border:0.5px solid var(--brd);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.dbt{font-size:13px;font-weight:500;margin-bottom:10px}
.brw{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.brl{font-size:11px;color:var(--muted);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brt{flex:1;background:var(--bg);border-radius:4px;height:7px;overflow:hidden}
.brf{height:100%;border-radius:4px;background:var(--red)}.brv{font-size:12px;font-weight:500;min-width:22px;text-align:right}
.dw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.dc{background:var(--card);border-radius:14px;border:0.5px solid var(--brd);padding:14px;text-align:center;box-shadow:var(--sh)}
.dn{font-size:26px;font-weight:600}.dl{font-size:11px;color:var(--muted);margin-top:2px}
.insight{background:linear-gradient(135deg,#C0392B,#922B21);border-radius:14px;padding:14px;margin-bottom:10px;color:#fff}
.insight-t{font-size:13px;font-weight:600;margin-bottom:4px}
.insight-s{font-size:12px;opacity:.85}
.prog-wrap{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden}
.prog-bar{height:100%;background:#fff;border-radius:3px;transition:width .4s}
#app-loading{position:fixed;inset:0;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#fff;gap:12px}
#app-loading.hide{display:none}
.act-foto-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;margin-bottom:10px;background:var(--bg);cursor:zoom-in}
.act-foto-wrap img{width:100%;max-height:220px;object-fit:cover;display:block}
.act-foto-zoom{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;border-radius:6px;padding:2px 8px;font-size:10px;pointer-events:none}
.tam-p{background:#EAF4FB;color:#1A5276;display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.tam-m{background:var(--alight);color:#7E5109;display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
.tam-g{background:var(--glight);color:#145A32;display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600}
/* FERRETERIAS */
.ferr-card{background:var(--card);border-radius:14px;border:0.5px solid var(--brd);padding:13px;margin-bottom:9px;box-shadow:var(--sh);display:flex;gap:11px;align-items:center}
.ferr-num{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ferr-body{flex:1;min-width:0}
.ferr-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ferr-dist{font-size:11px;color:var(--muted);margin-top:2px}
.ferr-addr{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ferr-btns{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.fc-ani{font-size:34px;animation:bounce .8s infinite alternate;display:block;text-align:center}
@keyframes bounce{0%{transform:translateY(0)}100%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div id="app-loading">
  <div style="width:64px;height:64px;background:rgba(255,255,255,.2);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700">A</div>
  <div style="font-size:16px;font-weight:600">Actividapp</div>
  <div style="font-size:13px;opacity:.7">Conectando...</div>
</div>
<div id="app">
<!-- El contenido aquí es extenso y se asume el que se recuperó previamente -->
</div>
<script type="module">
// Configuración de Firebase y funciones
// (Aquí iría todo el bloque import y config que estaba en el archivo)
async function loadAll(){
  try{
    // ... lógica de carga existente ...
    window._dataReady=true;
    // ... 
    const cu = loadS();
    if(cu && !window.CU){
      applyU(cu);
      go('home');
    } else if(!window.CU){
      go('login');
    }
  } catch(e) {
    console.error('loadAll error:', e);
    go('login'); 
    toast('Error de conexión. Intente reingresar.');
  } finally {
    const loadingScreen = document.getElementById('app-loading');
    if(loadingScreen) loadingScreen.classList.add('hide');
  }
}
// El resto del script...
</script>
</body>
</html>
